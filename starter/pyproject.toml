[project]
name = "customer-support-agentcore-starter"
version = "0.1.0"
description = "Udacity customer support agent using Strands SDK and Amazon Bedrock AgentCore."
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "bedrock-agentcore>=1.0.0",
    "bedrock-agentcore-starter-toolkit>=0.3.13,<1.0.0",
    "mcp>=1.9.0",
    "pydantic>=2.0.0",
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.2.0",
    "playwright>=1.45.0",
    "nest-asyncio>=1.6.0",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false
